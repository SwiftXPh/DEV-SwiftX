# Render Blueprint (Infrastructure as Code) for SwiftX.
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets are NOT stored here (sync: false) — set their values in the Render
# dashboard. Non-secret config has inline values.
services:
  # ── Production ─────────────────────────────────────────────────────────────
  - type: web
    name: swiftx
    runtime: docker
    dockerfilePath: ./SwiftX/Dockerfile
    dockerContext: ./SwiftX
    branch: main
    plan: free                # upgrade to "starter" ($7/mo) for always-on
    region: singapore
    healthCheckPath: /
    autoDeploy: false         # deploy via CI/CD hook or manual trigger
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Supabase__RiderBucket
        value: rider-documents
      - key: Supabase__MerchantBucket
        value: merchant-documents
      # Secrets / per-environment values — set these in the Render dashboard.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: AdminSeed__Username
        sync: false
      - key: AdminSeed__Password
        sync: false
      - key: AdminSeed__Email
        sync: false
      - key: AllowedHosts
        sync: false           # set to: swiftxph.com,www.swiftxph.com

  # ── Staging ────────────────────────────────────────────────────────────────
  - type: web
    name: swiftx-staging
    runtime: docker
    dockerfilePath: ./SwiftX/Dockerfile
    dockerContext: ./SwiftX
    branch: staging
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true          # auto-deploy when staging branch is pushed
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: Supabase__RiderBucket
        value: rider-documents
      - key: Supabase__MerchantBucket
        value: merchant-documents
      # Secrets / per-environment values — set these in the Render dashboard.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: AdminSeed__Username
        sync: false
      - key: AdminSeed__Password
        sync: false
      - key: AdminSeed__Email
        sync: false
      - key: AllowedHosts
        sync: false           # set to the staging .onrender.com domain
