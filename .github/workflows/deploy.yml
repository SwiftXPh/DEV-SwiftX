name: Deploy

# Trigger a Render deploy after CI passes on staging or main.
# Only runs on pushes (not PRs) — PRs only get CI checks.
on:
  push:
    branches: [ main, staging ]

jobs:
  # ── Staging: auto-deploy on push to staging ──
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: []  # runs immediately (CI is a separate workflow)
    environment: staging
    steps:
      - name: Trigger Render deploy (staging)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

  # ── Production: deploy on push to main (with environment protection) ──
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: []
    environment: production  # GitHub environment protection rules gate this
    steps:
      - name: Trigger Render deploy (production)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}"
        env:
          RENDER_DEPLOY_HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
