name: CI

# Gate every PR and push to staging/main on a successful build.
# Deploy jobs only run on pushes (not PRs) and only after CI passes.
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # ── CI: Build & Verify ─────────────────────────────────────────────────────
  build:
    name: Build & verify (.NET + Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwiftX
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Install npm dependencies (Tailwind)
        run: npm ci

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile + context Render uses, so a green build here means a
      # green build on Render.
      - name: Build Docker image
        run: docker build -f SwiftX/Dockerfile SwiftX

  # ── Deploy: Only after CI passes, only on push (not PRs) ───────────────────
  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [ build, docker ]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy (staging)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build, docker ]
    runs-on: ubuntu-latest
    environment: production  # GitHub environment protection rules gate this
    steps:
      - name: Trigger Render deploy (production)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}"
        env:
          RENDER_DEPLOY_HOOK_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
